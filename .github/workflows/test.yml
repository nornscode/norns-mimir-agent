name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimir_agent
          POSTGRES_PASSWORD: mimir_agent
          POSTGRES_DB: mimir_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimir_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIMIR_TEST_DATABASE_URL: postgresql://mimir_agent:mimir_agent@localhost:5432/mimir_agent
      MIMIR_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
